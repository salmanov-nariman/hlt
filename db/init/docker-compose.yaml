services:
  postgres:
    image: postgres:15-alpine
    container_name: hlt_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: confluentinc/confluent-local:7.6.0
    container_name: hlt_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 'hlt-chat-cluster-uuid1'
volumes:
    pgdata: