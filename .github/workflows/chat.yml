name: Chat CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/chat/**'
      - '.github/workflows/chat.yml'

  push:
    branches:
      - main
    paths:
      - 'services/chat/**'
      - '.github/workflows/chat.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Chat
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/chat

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d chat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/chat_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      KAFKA_BROKERS: localhost:9092 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/chat/go.mod
          cache-dependency-path: services/chat/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -count=1 ./...

      - name: Build application
        run: go build ./...

      - name: Build Docker image
        run: docker build --tag hlt-chat:ci .

      - name: Start Chat container
        run: |
          docker run --detach \
            --name chat-ci \
            --network host \
            --env DATABASE_URL \
            --env REDIS_ADDR \
            --env KAFKA_BROKERS \
            hlt-chat:ci

      - name: Check application startup
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 2 \
              http://localhost:8080/metrics > /dev/null; then
              echo "Chat started successfully"
              exit 0
            fi
            sleep 2
          done

          echo "Chat did not start within the expected time"
          exit 1

      - name: Show container logs
        if: always()
        run: |
          if docker container inspect chat-ci > /dev/null 2>&1; then
            docker logs chat-ci
          fi

      - name: Stop Chat container
        if: always()
        run: |
          if docker container inspect chat-ci > /dev/null 2>&1; then
            docker rm --force chat-ci
          fi

  publish-image:
    name: Publish Chat image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/salmanov-nariman/hlt-chat:sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE" \
            --push \
            ./services/chat
