spring:
  application:
    name: auth

  r2dbc:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    url: ${DB_URL_JDBC}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  grpc:
    client:
      channel:
        email:
          target: ${EMAIL_GRPC_TARGET}
          ssl:
            enabled: false
        user:
          target: ${USER_GRPC_TARGET}
          ssl:
            enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${ACCESS_EXPIRATION}

verification:
  code-expiration: ${VERIFICATION_CODE_EXPIRATION}
  registration-expiration: ${VERIFICATION_REGISTRATION_EXPIRATION}
  max-attempts: ${VERIFICATION_MAX_ATTEMPTS}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: auth-service
