apiVersion: v1
kind: Service
metadata:
  name: user-postgres
  namespace: hlt

spec:
  clusterIP: None
  selector:
    service-target: user-postgres-pods
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-postgres
  namespace: hlt

spec:
  serviceName: user-postgres
  replicas: 1
  selector:
    matchLabels:
      statefulset-owner: user-postgres
  template:
    metadata:
      labels:
        service-target: user-postgres-pods
        statefulset-owner: user-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: user-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - user
                - -d
                - user-db
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
