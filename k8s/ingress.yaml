apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: hlt

spec:
  ingressClassName: nginx
  rules:
    - host: hlt.com
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /api/booking
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 80
          - path: /api/event
            pathType: Prefix
            backend:
              service:
                name: event-service
                port:
                  number: 80
          - path: /api/user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80