apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hlt

spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-container
          image: ghcr.io/salmanov-nariman/hlt-auth:sha-37920fa2376d5e1c101cfc1ec1e431e7e886b593
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret