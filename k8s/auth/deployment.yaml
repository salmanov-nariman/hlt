apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hlt

spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-container
          image: ghcr.io/salmanov-nariman/hlt-auth:sha-5e8b0a628af08b6651ea89d4b6f1a430babc0588
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret