apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hlt

spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-container
          image: ghcr.io/salmanov-nariman/hlt-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080