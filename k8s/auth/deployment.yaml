apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hlt

spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-container
          image: ghcr.io/salmanov-nariman/hlt-auth:sha-cbcd706e2c764a25d10a7bf040ceabea2682d6b1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret