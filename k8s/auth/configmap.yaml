apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: hlt

data:
  DB_URL: "r2dbc:postgresql://auth-postgres.hlt.svc.cluster.local:5432/auth_db"
  DB_URL_JDBC: "jdbc:postgresql://auth-postgres.hlt.svc.cluster.local:5432/auth_db"
  EMAIL_GRPC_TARGET: "email-service:9090"
  ACCESS_EXPIRATION: "900000"
  VERIFICATION_CODE_EXPIRATION: "5m"
  VERIFICATION_REGISTRATION_EXPIRATION: "15m"
  VERIFICATION_MAX_ATTEMPTS: "5"